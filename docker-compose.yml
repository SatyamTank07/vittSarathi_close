version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_funda_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace
      # Prevent node_modules or virtualenv from mounting back if they exist, not needed here
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=development
    restart: always
