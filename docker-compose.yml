version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai_funda_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aifunda_chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_funda_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/aifunda_chat
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
